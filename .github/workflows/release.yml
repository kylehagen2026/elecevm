name: Release
# Tags and publishes a GitHub Release whenever the version in pyproject.toml has no
# tag yet (on push to main or by hand), attaches the built wheel and sdist, and then
# publishes to PyPI through trusted publishing. The PyPI job fails until the pending
# publisher is registered on pypi.org (see RELEASING.md); the release itself still lands.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/elecevm/__init__.py
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: |
          echo "version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$V" | grep -q "refs/tags/$V"; then
            echo "tag $V already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --quiet --upgrade pip build
          python -m build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "elecevm ${{ steps.version.outputs.version }}"
          git push origin "$V"
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > /tmp/notes.md
          gh release create "$V" dist/* --title "elecevm ${{ steps.version.outputs.version }}" --notes-file /tmp/notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  pypi:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing — no API token is stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --upgrade pip build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
